<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna Bobola | Wakabyte – 2D Arcade Engine</title>
    <meta name="description" content="Wakabyte 2D Arcade Game Engine built with TypeScript and HTML5 Canvas by Anna Bobola." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%23FFCC00'/><polygon points='8,8 16,3 16,13' fill='%23111111'/></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>WAKABYTE</h1>
      <p>2D Arcade Engine &middot; Crafted by Anna Bobola</p>
    </header>

    <main id="game-container">
      <canvas id="game-canvas" width="448" height="576"></canvas>

      <section class="virtual-controls" id="virtual-controls" aria-label="Touch Controls">
        <div class="dpad-container" id="dpad">
          <button type="button" class="dpad-btn dpad-up" id="btn-up" aria-label="Up">▲</button>
          <div class="dpad-middle">
            <button type="button" class="dpad-btn dpad-left" id="btn-left" aria-label="Left">◀</button>
            <div class="dpad-center" aria-hidden="true"></div>
            <button type="button" class="dpad-btn dpad-right" id="btn-right" aria-label="Right">▶</button>
          </div>
          <button type="button" class="dpad-btn dpad-down" id="btn-down" aria-label="Down">▼</button>
        </div>

        <div class="action-buttons">
          <button type="button" class="action-btn" id="btn-pause" aria-label="Pause or Resume Game">
            <span class="btn-icon">⏸</span>
            <span class="btn-label">PAUSE</span>
          </button>
          <button type="button" class="action-btn" id="btn-mute" aria-label="Toggle Audio Mute">
            <span class="btn-icon">🔊</span>
            <span class="btn-label">MUTE</span>
          </button>
        </div>
      </section>

      <div class="controls-hint">
        Controls: [Arrow Keys / WASD] Move &middot; [P / Space] Pause &middot; [M] Mute &middot; [Touch / Swipe]
      </div>
    </main>

    <footer>
      <div class="footer-links">
        <a href="https://linkedin.com/in/annabobola" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <span class="separator">/</span>
        <a href="https://github.com/abobola/wakabyte" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="separator">/</span>
        <a href="mailto:hi@annabobola.pl">hi@annabobola.pl</a>
      </div>
      <div class="footer-copyright">
        &copy; 2026 Anna Bobola Software Solutions
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
